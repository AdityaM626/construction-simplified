name: Sprint 1 lockfile refresh

on:
  push:
    branches:
      - debayan/sprint-1-data-navigation
    paths:
      - packages/data/package.json
      - packages/data/prisma/schema.prisma
      - .github/workflows/sprint1-lockfile.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx prisma validate --config packages/data/prisma7.config.ts
      - name: Generate initial migration
        run: |
          mkdir -p packages/data/prisma/migrations/20260923000000_initial
          npx prisma migrate diff --config packages/data/prisma7.config.ts --from-empty --to-schema packages/data/prisma/schema.prisma --script --output packages/data/prisma/migrations/20260923000000_initial/migration.sql
      - name: Commit resolved lockfile and migration
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git ls-files --others --exclude-standard packages/data/prisma/migrations)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package-lock.json packages/data/prisma/migrations
            git commit -m "chore: lock data dependencies and record initial migration"
            git push
          fi
